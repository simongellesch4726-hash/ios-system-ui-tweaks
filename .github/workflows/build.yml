name: Build tweaks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RootHide Theos
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos -o install-theos.sh
          bash install-theos.sh
          test -f "$THEOS/makefiles/common.mk"

      - name: Build RecordingPillFix
        shell: bash
        run: |
          set -euxo pipefail
          make -C RecordingPillFix clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Build iOS26UI
        shell: bash
        run: |
          set -euxo pipefail
          make -C iOS26UI clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Verify packages
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/verify-deb.sh
          scripts/verify-deb.sh RecordingPillFix/packages/*.deb iOS26UI/packages/*.deb

      - name: Collect packages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          find RecordingPillFix/packages iOS26UI/packages -type f -name '*.deb' -print -exec cp {} artifacts/ \;
          test "$(find artifacts -type f -name '*.deb' | wc -l | tr -d ' ')" -eq 2

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ios-system-ui-tweaks-debs
          path: artifacts/*.deb
          if-no-files-found: error
