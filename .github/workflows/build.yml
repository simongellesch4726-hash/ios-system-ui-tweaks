name: Build tweaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 60); do
            if ! fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; then break; fi
            sleep 2
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git make perl python3 clang llvm lld dpkg-dev fakeroot xz-utils file

      - name: Install RootHide Theos
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --recursive https://github.com/roothide/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          "$THEOS/bin/install-sdk" latest
          find "$THEOS/sdks" -maxdepth 1 -name '*.sdk' -print -quit | grep -q .

      - name: Build RecordingPillFix
        run: make -C RecordingPillFix clean package FINALPACKAGE=1

      - name: Build iOS26UI
        run: make -C iOS26UI clean package FINALPACKAGE=1

      - name: Verify packages
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/verify-deb.sh
          scripts/verify-deb.sh RecordingPillFix/packages/*.deb iOS26UI/packages/*.deb

      - name: Collect packages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          find RecordingPillFix/packages iOS26UI/packages -type f -name '*.deb' -print -exec cp {} artifacts/ \;
          test "$(find artifacts -type f -name '*.deb' | wc -l | tr -d ' ')" -eq 2

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ios-system-ui-tweaks-debs
          path: artifacts/*.deb
          if-no-files-found: error
