name: Build tweaks

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RootHide Theos
        run: |
          git clone --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build RecordingPillFix
        run: |
          make -C RecordingPillFix clean
          make -C RecordingPillFix package FINALPACKAGE=1
      - name: Build iOS26UI
        run: |
          make -C iOS26UI clean
          make -C iOS26UI package FINALPACKAGE=1
      - name: Verify packages
        run: |
          chmod +x scripts/verify-deb.sh
          scripts/verify-deb.sh RecordingPillFix/packages/*.deb iOS26UI/packages/*.deb
      - name: Collect packages
        run: |
          mkdir -p artifacts
          cp RecordingPillFix/packages/*.deb artifacts/
          cp iOS26UI/packages/*.deb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-system-ui-tweaks-debs
          path: artifacts/*.deb
          if-no-files-found: error
